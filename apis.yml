description: 'Saks OFF 5TH is an American off-price retailer of designer and luxury
  fashion, footwear, accessories, and home goods, historically operated as the discount
  banner of Saks Fifth Avenue and later folded into Saks Global (Hudson''s Bay Company /
  HBC). It sold marked-down designer merchandise through outlet stores and an e-commerce
  site at saksoff5th.com. As of this enrichment pass the public website resolves to a
  shutdown notice with only a store-locations link, and the company publishes no developer
  portal, API documentation, SDKs, or machine-readable API surface. It was surfaced to
  the API Evangelist network as a portfolio-lead stub of Insight Partners in the consumer
  sector.'
